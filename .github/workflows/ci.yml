name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Gate on anything critical that can actually reach production. The two
      # standing high advisories are unreachable here: sharp ships with Next
      # but is only used by next/image, which this app doesn't use, and
      # brace-expansion lives under ESLint and never leaves devDependencies.
      # Clearing them would mean a forced major downgrade of Next for code
      # that never executes.
      - name: Audit (production deps, critical)
        run: npm audit --omit=dev --audit-level=critical

      # Full picture, including dev tooling — reported, never blocking.
      - name: Audit report (informational)
        run: npm audit || true
